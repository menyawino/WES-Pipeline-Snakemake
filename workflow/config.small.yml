threads_high: 4
threads_mid: 2
threads_low: 1
benchmark: 1

sample_processing:
  lanes: [1]
  reads: [1, 2]
  fail_on_missing: true

samplesfile: "samples.small.csv"
inputdir: "../input_small"
outdir: "../output_small"

output_dirs:
  qc_pretrim: "{outdir}/analysis/001_qc/pretrim"
  trimming: "{outdir}/analysis/002_trimming"
  qc_posttrim: "{outdir}/analysis/003_qc/posttrim"
  alignment: "{outdir}/analysis/004_alignment"
  bam_prep: "{outdir}/analysis/005_bam_prep"
  qc_bam: "{outdir}/analysis/006_qc/bam"
  variant_calling: "{outdir}/analysis/007_variant_calling"
  variant_filtering: "{outdir}/analysis/008_variant_filtering"
  annotation: "{outdir}/analysis/009_annotation"
  summary: "{outdir}/analysis/010_summary"
  logs: "{outdir}/logs"
  benchmarks: "{outdir}/benchmarks"
  results: "{outdir}/results"

# These are placeholders for later full runs; raw_fastqc does not consume them.
reference_genome: "resources/ref/grch38/GRCh38.primary_assembly.genome.fa"
icc_panel: "resources/ref/grch38/TruSight_Cardio_TargetedRegions_v1.0.hg38.bed"
cds_panel: "resources/ref/grch38/TruSight_Cardio_TargetedRegions_v1.0.hg38.bed"
canontran_panel: "resources/ref/grch38/TruSight_Cardio_TargetedRegions_v1.0.hg38.bed"
dbsnp: "resources/ref/grch38/dbsnp/Homo_sapiens_assembly38.dbsnp138.vcf"
omni: "resources/ref/grch38/1000G/1000G_omni2.5.hg38.vcf.gz"
tenk: "resources/ref/grch38/1000G/1000G.phase3.integrated.sites_only.no_MATCHED_REV.hg38.vcf"
tenk_indel: "resources/ref/grch38/indels/Homo_sapiens_assembly38.known_indels.vcf.gz"
hapmap: "resources/ref/grch38/hapmap/hapmap_3.3.hg38.vcf.gz"
mills: "resources/ref/grch38/indels/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"

fastp:
  min_read_length: 35
  window_size: 5

gatk:
  AddOrReplaceReadGroups:
    RGID: "1"
    RGLB: "lib1"
    RGPL: "illumina"
    RGPU: "unit1"
    RGSM: "TESTSMOKE"
    RGCN: "local"
    RGDS: "smoke"
    validation_stringency: "SILENT"
  MarkDuplicates:
    validation_stringency: "LENIENT"
  HaplotypeCaller:
    dcovg: 1000

vep:
  cache_dir: "/tmp/vep-cache"
  fasta: "/tmp/placeholder.fa"

variant_summary:
  top_variants: 10
  top_chromosomes: 10
  annotated_vcf_pattern: "{outdir}/analysis/009_annotation/{sample}.annotated.vcf"

snakemake:
  use_conda: true
  keep_going: true
  benchmark_extended: true
  print_shell_commands: true
  rerun_incomplete: true
  generate_report: false
  cores: 1
