# Global variables optimized for 88-vCPU / 228GB RAM system
threads_high: 22
threads_mid: 8
threads_low: 4
mem_high: 65536
mem_mid: 32768
mem_low: 8192
benchmark: 1

# Temporary directory in high-speed RAM disk (>50 GB/s bandwidth)
tmpdir: "/dev/shm/wes_pipeline_tmp"

# Interval scatter count for HaplotypeCaller parallelization
intervals_scatter_count: 20

# Sample processing configuration
sample_processing:
  lanes: [1, 2, 3, 4]  # Lane numbers to expect
  reads: [1, 2]        # Paired-end reads (1=R1, 2=R2)
  fail_on_missing: false  # Continue if some files are missing

# Directories
inputdir: "../input/180705_NB551088_0005_AHTLH3AFXX"
outdir: "../output_38"

# Output path templates for consistency across rules
output_dirs:
  qc_pretrim: "{outdir}/analysis/001_qc/pretrim"
  trimming: "{outdir}/analysis/002_trimming"
  qc_posttrim: "{outdir}/analysis/003_qc/posttrim"
  alignment: "{outdir}/analysis/004_alignment"
  bam_prep: "{outdir}/analysis/005_bam_prep"
  qc_bam: "{outdir}/analysis/006_qc/bam"
  variant_calling: "{outdir}/analysis/007_variant_calling"
  variant_filtering: "{outdir}/analysis/008_variant_filtering"
  annotation: "{outdir}/analysis/009_annotation"
  summary: "{outdir}/analysis/010_summary"
  logs: "{outdir}/logs"
  benchmarks: "{outdir}/benchmarks"
  results: "{outdir}/results"

Genome: &genome "grch38"

# GRCh38 Reference file
reference_genome: "resources/ref/grch38/GRCh38.primary_assembly.genome.fa"

# GRCh38 Target files
icc_panel: "resources/ref/grch38/TruSight_Cardio_TargetedRegions_v1.0.hg38.bed"
cds_panel: "resources/ref/grch38/TruSight_Cardio_TargetedRegions_v1.0.hg38.bed"
canontran_panel: "resources/ref/grch38/TruSight_Cardio_TargetedRegions_v1.0.hg38.bed"

# GRCh38 Known variants
dbsnp: "resources/ref/grch38/dbsnp/Homo_sapiens_assembly38.dbsnp138.vcf"
omni: "resources/ref/grch38/1000G/1000G_omni2.5.hg38.vcf.gz"
tenk: "resources/ref/grch38/1000G/1000G.phase3.integrated.sites_only.no_MATCHED_REV.hg38.vcf"
tenk_indel: "resources/ref/grch38/indels/Homo_sapiens_assembly38.known_indels.vcf.gz"
hapmap: "resources/ref/grch38/hapmap/hapmap_3.3.hg38.vcf.gz"
mills: "resources/ref/grch38/indels/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"

# GRCh37 Reference file
# reference_genome: "resources/ref/grch37/genome/GRCh37.primary_assembly.genome.fa"

# GRCh37 Target files
# icc_panel: "resources/ref/grch37/ICC_169Genes_Nextera_V4_ProteinCodingExons_overHang40bp.mergeBed.bed"
# cds_panel: "resources/ref/grch37/ICC_169Genes_Nextera_V4_ProteinCodingExons.mergeBed.bed"
# canontran_panel: "resources/ref/grch37/ICC_169Genes_Nextera_V4_ProteinCoding_CanonicalTrans.mergeBed.bed"

# GRCh37 Known variants
# dbsnp: "resources/ref/grch37/hg19_dbSNP138.vcf"
# omni: "resources/ref/grch37/1000G_omni2.5.hg19.vcf"
# tenk: "resources/ref/grch37/1000G_phase1.snps.high_confidence.hg19.vcf"
# tenk_indel: "resources/ref/grch37/1000G_phase1.indels.hg19.vcf"
# hapmap: "resources/ref/grch37/hapmap_3.3.hg19.vcf"
# mills: "resources/ref/grch37/Mills_and_1000G_gold_standard.indels.hg19.vcf"

# Tool-specific parameters
fastp:
  min_read_length: 35
  window_size: 5
gatk:
  AddOrReplaceReadGroups:
    RGID: "1"
    RGLB: "lib1"
    RGPL: "illumina"
    RGPU: "unit1"
    RGSM: "20"
    RGCN: "Broad"
    RGDS: "ICC"
    validation_stringency: "SILENT"
  MarkDuplicates:
    validation_stringency: "LENIENT"
  HaplotypeCaller:
    dcovg: 1000

# VEP parameters
vep:
  cache_dir: "/path/to/vep/cache"
  fasta: "resources/ref/grch38/GRCh38.primary_assembly.genome.fa"

# Local variant-reporting parameters inspired by ClawBio annotation workflows
variant_summary:
  top_variants: 10
  top_chromosomes: 10
  annotated_vcf_pattern: "{outdir}/analysis/009_annotation/{sample}.annotated.vcf"

# Snakemake execution options
snakemake:
  use_conda: true
  keep_going: true
  benchmark_extended: true
  print_shell_commands: true
  rerun_incomplete: true
  generate_report: true
  cores: 8  # Default core allocation, can be overridden via CLI

