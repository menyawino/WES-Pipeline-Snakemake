# Tool-specific parameters
fastp:
  min_read_length: 35
  window_size: 5
gatk:
  AddOrReplaceReadGroups:
    RGID: "1"
    RGLB: "lib1"
    RGPL: "illumina"
    RGPU: "unit1"
    RGSM: "20"
    RGCN: "Broad"
    RGDS: "ICC"
    validation_stringency: "SILENT"
  MarkDuplicates:
    validation_stringency: "LENIENT"
  HaplotypeCaller:
    dcovg: 1000

# VEP parameters
vep:
  mode: "offline" # Uses local Ensembl VEP 104_GRCh38 cache for high-speed offline annotation
  species: "homo_sapiens"
  assembly: "GRCh38"

# Local variant-reporting parameters
variant_summary:
  top_variants: 10
  top_chromosomes: 10
  annotated_vcf_pattern: "{outdir}/analysis/007_annotation/{sample}.vep_annotated.vcf"

# Snakemake execution options
snakemake:
  use_conda: true
  use_singularity: true
  keep_going: true
  benchmark_extended: true
  print_shell_commands: true
  rerun_incomplete: true
  generate_report: true
  cores: 88  # Default core allocation, can be overridden via CLI

# Email notification settings (Snakemake onsuccess/onerror hooks)
email:
  enabled: false               # Set to true to enable email notifications
  to: "user@example.com"       # Recipient email address(es), comma-separated
  from: "wes-pipeline@localhost" # Sender email address
  smtp_host: "localhost"       # SMTP server host (e.g. smtp.gmail.com)
  smtp_port: 25                # SMTP port (25, 587 for STARTTLS, 465 for SSL)
  use_tls: false               # Enable STARTTLS encryption (recommended for port 587)
  use_ssl: false               # Enable SSL encryption (recommended for port 465)
  username: ""                 # SMTP username (if authentication is required)
  password: ""                 # SMTP password or application-specific token
  notify_on_success: true      # Send email on successful workflow completion
  notify_on_error: true        # Send email on workflow failure

# Seqera token
token: "eyJ0aWQiOiAxMDgwOH0uOWM0ZjQ3ZTZiNTYzZTFmNWU4MjdlMzViZjI1OGVjOWY1MTI2MTUzMQ=="