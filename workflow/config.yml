# Cluster resource defaults (4 nodes x 80 cores = 320 cores total)
threads_high: 16     # High-throughput parallel alignments / DeepVariant (20 concurrent on 320 cores)
threads_mid: 8       # BQSR, MarkDuplicates, VCF Genotyping / Filtering (40 concurrent)
threads_low: 4       # HaplotypeCaller interval chunks, FastQC, Indexing (80 concurrent)
mem_high: 32768      # 32GB for alignment, DeepVariant, large merges
mem_mid: 16384       # 16GB for GATK BQSR, Gather, Genotyping, VEP
mem_low: 8192        # 8GB for QC, filtering, HaplotypeCaller chunks
mem_min: 4096        # 4GB default fallback
benchmark: 1

# Node-local scratch directory
tmpdir: "/tmp"

# Interval scatter count for parallel HaplotypeCaller across 320 cores
intervals_scatter_count: 40

# Variant Callers configuration (default: GATK only; use --deepvariant flag to enable dual callers)
variant_callers:
  - "gatk"

deepvariant:
  model_type: "WES"
  version: "1.6.1"

# Sample processing configuration
sample_processing:
  lanes: [1, 2, 3, 4]  # Lane numbers to expect
  reads: [1, 2]        # Paired-end reads (1=R1, 2=R2)
  fail_on_missing: false  # Continue if some files are missing

# Directories
inputdir: "../input/180705_NB551088_0005_AHTLH3AFXX"
outdir: "../output_38"

# Output path templates for consistency across rules
output_dirs:
  trimming: "{outdir}/analysis/001_trimming"
  alignment: "{outdir}/analysis/002_alignment"
  bam_prep: "{outdir}/analysis/003_bam_prep"
  bam_qc: "{outdir}/analysis/004_bam_qc"
  variant_calling: "{outdir}/analysis/005_variant_calling"
  variant_filtering: "{outdir}/analysis/006_variant_filtering"
  annotation: "{outdir}/analysis/007_annotation"
  summary: "{outdir}/analysis/008_summary"
  logs: "{outdir}/logs"
  benchmarks: "{outdir}/benchmarks"
  results: "{outdir}/results"


Genome: &genome "grch38"

# ==============================================================================
# 1. Reference Genome (Exact GRCh38 Build)
# ==============================================================================
# Official GATK Resource Bundle GRCh38 build (with chr prefix: chr1..chr22, chrX, chrY, chrM)
# Co-located indexes required: .fai (samtools faidx), .dict (CreateSequenceDictionary),
# and BWA-MEM2 indexes (.0123, .amb, .ann, .bwt.2bit.64, .pac).
reference_genome: "resources/ref/grch38/Homo_sapiens_assembly38.fasta"

# ==============================================================================
# 2. Target Capture BED Panels (Coordinated to GRCh38)
# ==============================================================================
icc_panel: "resources/ref/grch38/ICC_169Genes_Nextera_V4_ProteinCodingExons_overHang40bp.hg38.mergeBed.bed"
cds_panel: "resources/ref/grch38/ICC_169Genes_Nextera_V4_ProteinCodingExons.hg38.mergeBed.bed"
canontran_panel: "resources/ref/grch38/ICC_169Genes_Nextera_V4_ProteinCoding_CanonicalTrans.hg38.mergeBed.bed"

# ==============================================================================
# 3. BQSR Known Polymorphic Sites (GATK BaseRecalibrator)
# ==============================================================================
# Mask known polymorphisms so true biological variants are not misclassified as
# sequencing errors during Base Quality Score Recalibration.
# Recommended for human WES: matching dbSNP + curated high-confidence indels (Mills + 1000G).
dbsnp: "resources/ref/grch38/dbsnp/Homo_sapiens_assembly38.dbsnp138.vcf"
mills: "resources/ref/grch38/indels/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
tenk_indel: "resources/ref/grch38/indels/Homo_sapiens_assembly38.known_indels.vcf.gz"

# ==============================================================================
# 4. Optional VQSR Training & Truth Resources
# ==============================================================================
# Note: HapMap, Omni, and 1000G are training/truth sets for Variant Quality Score
# Recalibration (VQSR). This pipeline uses GATK Hard Filtering (VariantFiltration),
# which is the Broad Institute recommended standard for small-to-medium WES cohorts
# where variant numbers are insufficient to model VQSR Gaussian mixtures.
# Commented out below to avoid dead configuration; uncomment if running cohort VQSR.
# hapmap: "resources/ref/grch38/hapmap/hapmap_3.3.hg38.vcf.gz"
# omni: "resources/ref/grch38/1000G/1000G_omni2.5.hg38.vcf.gz"
# tenk: "resources/ref/grch38/1000G/1000G.phase3.integrated.sites_only.no_MATCHED_REV.hg38.vcf"

# Tool-specific parameters
fastp:
  min_read_length: 35
  window_size: 5
gatk:
  AddOrReplaceReadGroups:
    RGID: "1"
    RGLB: "lib1"
    RGPL: "illumina"
    RGPU: "unit1"
    RGSM: "20"
    RGCN: "Broad"
    RGDS: "ICC"
    validation_stringency: "SILENT"
  MarkDuplicates:
    validation_stringency: "LENIENT"
  HaplotypeCaller:
    dcovg: 1000

# VEP parameters
vep:
  mode: "offline" # Runs local Ensembl VEP offline using high-performance local cache
  species: "homo_sapiens"
  assembly: "GRCh38"
  cache_version: "104"
  cache_dir: "resources/vep_cache"
  synonyms: "resources/vep_cache/homo_sapiens/104_GRCh38/chr_synonyms.txt"

# Local variant-reporting parameters
variant_summary:
  top_variants: 10
  top_chromosomes: 10
  annotated_vcf_pattern: "{outdir}/analysis/007_annotation/{sample}.vep_annotated.vcf"

# Legacy 46-column coverage summary report parameters
coverage_summary:
  genome_size: 3095693981       # GRCh38 primary assembly size in bp for enrichment factor
  min_snps: 200                 # Flag warning if passing SNPs <= min_snps (legacy condition)
  min_indels: 20                # Flag warning if passing INDELs <= min_indels
  min_titv: 2.0                 # Expected Ti/Tv ratio for exome (~2.0 - 3.5)
  min_callable_pct: 80.0        # Minimum %callable bases
  max_het_ab_bias_pct: 25.0     # Maximum Het AB deviation percentage

# Genome in a Bottle (GIAB) Benchmarking parameters
giab_benchmark:
  enabled: false
  sample: "HG001"
  truth_vcf: "resources/giab/HG001/HG001_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
  truth_bed: "resources/giab/HG001/HG001_GRCh38_1_22_v4.2.1_benchmark.bed"

# Snakemake execution options
snakemake:
  use_conda: true
  use_singularity: true
  keep_going: true
  benchmark_extended: true
  print_shell_commands: true
  rerun_incomplete: true
  generate_report: true
  cores: 88  # Default core allocation, can be overridden via CLI

# Email notification settings (Snakemake onsuccess/onerror hooks)
email:
  enabled: false               # Set to true to enable email notifications
  to: "user@example.com"       # Recipient email address(es), comma-separated
  from: "wes-pipeline@localhost" # Sender email address
  smtp_host: "localhost"       # SMTP server host (e.g. smtp.gmail.com)
  smtp_port: 25                # SMTP port (25, 587 for STARTTLS, 465 for SSL)
  use_tls: false               # Enable STARTTLS encryption (recommended for port 587)
  use_ssl: false               # Enable SSL encryption (recommended for port 465)
  username: ""                 # SMTP username (if authentication is required)
  password: ""                 # SMTP password or application-specific token
  notify_on_success: true      # Send email on successful workflow completion
  notify_on_error: true        # Send email on workflow failure