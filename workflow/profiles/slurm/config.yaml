# Snakemake Slurm profile optimized for 4 nodes x 80 cores (320 cores total)
executor: slurm
jobs: 320
software-deployment-method: conda

default-resources:
  mem_mb: 4000
  runtime: 1440

retries: 2
max-jobs-per-second: 15
max-status-checks-per-second: 10
latency-wait: 60
printshellcmds: true
keep-going: true
rerun-incomplete: true
